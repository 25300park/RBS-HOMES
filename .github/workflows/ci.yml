name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "mysql://fakeuser:fakepass@fake-host-does-not-exist:3306/fakedb"
      NEXTAUTH_SECRET: "fake-secret-for-ci-build-only"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "fake-google-client-id"
      GOOGLE_CLIENT_SECRET: "fake-google-client-secret"
      GOOGLE_PLACE_ID: "fake-place-id"
      GOOGLE_MAPS_URL: "http://example.invalid"
      NEXT_PUBLIC_GOOGLE_KEY: "fake-google-maps-key"
      R2_ENDPOINT: "https://fake.r2.cloudflarestorage.com"
      R2_BUCKET_NAME: "fake-bucket"
      R2_PUBLIC_URL: "https://fake-images.invalid"
      R2_ACCESS_KEY_ID: "fake-r2-access-key"
      R2_SECRET_ACCESS_KEY: "fake-r2-secret-key"
      RESEND_API_KEY: "fake-resend-key"
      EMAIL_MODE: "off"
      RBS_SYNC_SECRET: "fake-sync-secret"
      CRM_SYNC_SECRET: "fake-crm-sync-secret"
      CRM_ADMIN_ID: "1"
      ANTHROPIC_API_KEY: "fake-anthropic-key"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
